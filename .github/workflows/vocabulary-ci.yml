name: Vocabulary CI

on:
  push:
    paths:
      - "docs/**"
      - "scripts/**"
      - ".github/workflows/vocabulary-ci.yml"
  pull_request:
    paths:
      - "docs/**"
      - "scripts/**"
      - ".github/workflows/vocabulary-ci.yml"
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-and-suggest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate vocabulary chunks
        env:
          VOCAB_DIST_DIR: docs
        run: node scripts/validate-vocabulary.mjs

      - name: Generate weekly word suggestions
        env:
          VOCAB_DIST_DIR: docs
        run: node scripts/suggest-new-words.mjs

      - name: Commit updated suggestions
        if: github.event_name != 'pull_request'
        run: |
          if git diff --quiet -- reports/vocabulary_suggestions.md; then
            echo "No changes to the suggestion report."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/vocabulary_suggestions.md
          git commit -m "chore: update vocabulary suggestions"
          git push

      - name: Upload word suggestion report
        uses: actions/upload-artifact@v4
        with:
          name: vocabulary-suggestions
          path: reports/vocabulary_suggestions.md
